  <button type="button" id="exportwall" class="jprimary">배경화면 이미지 저장·공유</button><p id="lkplatformnote" class="lkhelp"></p>
 </aside></div>
 <div id="appmessage" role="status" hidden></div>
 <div id="jsheet" hidden></div><div id="backup" hidden></div>
</div>
</div>
